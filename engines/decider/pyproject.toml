[project]
name = "engine-decider"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "decider-ai[metal]==1.5.0",
    "labkit",
]

[tool.uv.sources]
labkit = { path = "../../labkit", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
