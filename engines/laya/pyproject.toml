[project]
name = "engine-laya"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "labkit",
    "laya==0.3.20",
]

[tool.uv.sources]
labkit = { path = "../../labkit", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
