name: Benchmark results
description: Share `make suite` results from your Mac
labels: [results]
body:
  - type: input
    id: chip
    attributes:
      label: Chip, memory, macOS
      placeholder: "M3 Pro, 36 GB, macOS 26.4"
    validations:
      required: true
  - type: textarea
    id: table
    attributes:
      label: Results
      description: Paste the Benchmarks → All datasets table, or attach the exported JSON.
    validations:
      required: true
