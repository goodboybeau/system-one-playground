name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. make lab\n2. Start Laya · English on mps\n3. …"
    validations:
      required: true
  - type: textarea
    id: machine
    attributes:
      label: Machine
      description: Paste the output of `make doctor`.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Engine logs are in `.run/logs/<engine>.log` (or the Log button on the Engines page).
      render: text
