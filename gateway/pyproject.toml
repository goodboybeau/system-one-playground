[project]
name = "gateway"
version = "0.1.0"
description = "System One Playground gateway: engine supervisor, metrics, benchmarks and the UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psutil>=6",
    "pydantic>=2.9",
    "labkit",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
lab = "gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx` with `starlette.testclient`"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
labkit = { path = "../labkit", editable = true }
